# Smithery configuration for DETRAN AL: Renajud
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_detran_al_renajud

name: detran_al_renajud-mcp
displayName: "DETRAN AL: Renajud"
description: >
  DETRAN AL: Renajud, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/detran_al_renajud-mcp
repository: https://github.com/mcp-dir/detran_al_renajud-mcp

tags:
  - detran_al_renajud
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_detran_al_renajud

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_detran_al_renajud/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
